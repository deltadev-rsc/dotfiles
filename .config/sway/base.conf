include ~/.config/sway/catppuccin.conf

exec swaync --config ~/.config/swaync/config.jsonc 
# --style ~/.config/swaync/style.css

set $mod Mod4
set $left h
set $down j
set $up k
set $right l
set $term ghostty
set $menu wofi --show drun
set $filemanager nemo
set $screenshot hyprshot -h

set $ws1 " "
set $ws2 "󰈹 "
set $ws3 " "
set $ws4 " "
set $ws5 "󱧶 "
set $ws6 "󱫋 "

workspace $ws1
workspace $ws2
workspace $ws3
workspace $ws4
workspace $ws5
workspace $ws6

workspace $ws1

gaps inner 0 
gaps outer 0 

default_border pixel 2.7
default_floating_border pixel 2.7

# gruvbox
# client.focused #c0a25d #c0a25d #c0a25d #c0a25d

# everforest
#client.focused #a7c080 #a7c080 #a7c080 #a7c080
#client.unfocused #1e1e1e #1e1e1e #1e1e1e #1e1e1e

# nordic
#client.focused #bbc3d4 #d8dee9 #d8dee9 #d8dee9

# catppuccin mocha lavender
client.focused           $lavender $base $text  $lavender $lavender
client.focused_inactive  $overlay0 $base $text  $overlay0 $overlay0
client.unfocused         $overlay0 $base $text  $rosewater $overlay0
client.urgent            $peach    $base $peach $overlay0  $peach
client.placeholder       $overlay0 $base $text  $overlay0  $overlay0
client.background        $base

